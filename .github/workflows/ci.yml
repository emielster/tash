name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, dash, ksh, mksh, zsh, yash, busybox]
    steps:
      - uses: actions/checkout@v4

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y dash ksh mksh zsh yash busybox

      - name: Run Tash (${{ matrix.shell }})
        run: |
          if [ "${{ matrix.shell }}" = "busybox" ]; then
            busybox ash tests/tash-tests.sh
          else
            "${{ matrix.shell }}" tests/tash-tests.sh
          fi
